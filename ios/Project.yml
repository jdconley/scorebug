# XcodeGen spec. Generates `Scorebug.xcodeproj` from the source tree.
# Install xcodegen: brew install xcodegen
# Then:           cd ios && xcodegen generate && open Scorebug.xcodeproj

name: Scorebug
options:
  bundleIdPrefix: live.scorebug
  deploymentTarget:
    iOS: 17.0
  groupSortPosition: top
  developmentLanguage: en
  xcodeVersion: '16.0'

settings:
  base:
    SWIFT_VERSION: '5.10'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: '0.0.1'
    CURRENT_PROJECT_VERSION: '1'

packages:
  HaishinKit:
    url: https://github.com/shogo4405/HaishinKit.swift
    from: 2.0.4

targets:
  Scorebug:
    type: application
    platform: iOS
    sources:
      - path: Sources/Scorebug
    resources:
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: AccentColor
        NSCameraUsageDescription: Scorebug needs the camera to film the game.
        NSMicrophoneUsageDescription: Scorebug needs the microphone to record gym audio.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.app
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        SWIFT_OBJC_BRIDGING_HEADER: ''
        ENABLE_BITCODE: NO
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
