# Generate: xcodegen generate --spec ios/Project.yml
name: Scorebug
options:
  bundleIdPrefix: live.scorebug
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '5.10'
    MARKETING_VERSION: '0.0.1'
    CURRENT_PROJECT_VERSION: '1'
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
packages:
  ScorebugCore:
    path: Packages/ScorebugCore
  ScorebugMedia:
    path: Packages/ScorebugMedia
  ScorebugStreaming:
    path: Packages/ScorebugStreaming
targets:
  Scorebug:
    type: application
    platform: iOS
    sources:
      - path: Sources/Scorebug
      - path: Sources/WatchSupport
      - path: Sources/ScorebugScoring
        excludes:
          - ScoringApp.swift
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Scorebug
        UILaunchScreen: {}
        NSCameraUsageDescription: Scorebug uses the camera when you choose to record video.
        NSMicrophoneUsageDescription: Scorebug records audio with your video.
        NSLocalNetworkUsageDescription: Connect to your Scorebug server for native scoring and streaming.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.app
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - package: ScorebugCore
      - package: ScorebugMedia
      - package: ScorebugStreaming
      - target: ScorebugWatch
        embed: true
  ScorebugWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/ScorebugWatch
      - path: Sources/WatchSupport
    info:
      path: Resources/Watch-Info.plist
      properties:
        CFBundleDisplayName: Scorebug
        WKApplication: true
        WKCompanionAppBundleIdentifier: live.scorebug.app
        WKRunsIndependentlyOfCompanionApp: true
        NSLocalNetworkUsageDescription: Connect to your Scorebug server to score matches.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.app.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
    dependencies:
      - package: ScorebugCore
  ScorebugWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.watch.uitests
    dependencies:
      - target: ScorebugWatch
  ScorebugAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.app.uitests
    dependencies:
      - target: Scorebug
  ScorebugFilmModelTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: Sources/Scorebug/Capture
      - path: Sources/Scorebug/Companion/PhoneWatchModel.swift
      - path: Sources/ScorebugWatch/WatchScoringModel.swift
      - path: Sources/WatchSupport/WatchRelaySessionGate.swift
      - path: FilmModelTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.film.modeltests
    dependencies:
      - package: ScorebugMedia
      - package: ScorebugStreaming
      - package: ScorebugCore
schemes:
  ScorebugWatch:
    build:
      targets:
        ScorebugWatch: all
    test:
      targets:
        - ScorebugWatchUITests
      environmentVariables:
        SCOREBUG_TEST_WATCH_SETUP: $(SCOREBUG_TEST_WATCH_SETUP)
  ScorebugFilmModelTests:
    build:
      targets:
        ScorebugFilmModelTests: all
    test:
      targets:
        - ScorebugFilmModelTests
  Scorebug:
    build:
      targets:
        Scorebug: all
    test:
      targets:
        - ScorebugAppUITests
      gatherCoverageData: true
      environmentVariables:
        SCOREBUG_TEST_API_URL: $(SCOREBUG_TEST_API_URL)
        SCOREBUG_TEST_STREAM_HOLD_SECONDS: $(SCOREBUG_TEST_STREAM_HOLD_SECONDS)
        SCOREBUG_TEST_MOTION_FIXTURE: $(SCOREBUG_TEST_MOTION_FIXTURE)
        SCOREBUG_TEST_NATIVE_QUALITY: $(SCOREBUG_TEST_NATIVE_QUALITY)
        SCOREBUG_TEST_UPLINK_PROXY_PORT: $(SCOREBUG_TEST_UPLINK_PROXY_PORT)
        SCOREBUG_TEST_TOKEN: qa-phone-token-not-production
