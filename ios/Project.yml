# Generate: xcodegen generate --spec ios/Project.yml
name: Scorebug
options:
  bundleIdPrefix: live.scorebug
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '5.10'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
packages:
  HaishinKit:
    path: ../vendor/HaishinKit
  ScorebugCore:
    path: Packages/ScorebugCore
  ScorebugMedia:
    path: Packages/ScorebugMedia
  ScorebugStreaming:
    path: Packages/ScorebugStreaming
targets:
  Scorebug:
    type: application
    platform: iOS
    sources:
      - path: Sources/Scorebug
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Scorebug
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - BarlowCondensed-Bold.ttf
          - BarlowCondensed-SemiBold.ttf
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: live.scorebug.links
            CFBundleURLSchemes:
              - scorebug
        NSCameraUsageDescription: Scorebug films the match with the camera and scans setup and invite codes.
        NSMicrophoneUsageDescription: Scorebug records the gym's sound with your video.
        NSPhotoLibraryAddUsageDescription: Scorebug saves your match videos to Photos when you ask it to.
        NSLocalNetworkUsageDescription: Scorebug talks to your Scorebug server on this network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.app
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ScorebugCore
      - package: ScorebugMedia
      - package: ScorebugStreaming
      - target: ScorebugWatch
        embed: true
  ScorebugWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/ScorebugWatch
      - path: Resources/WatchAssets.xcassets
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Resources/Watch-Info.plist
      properties:
        CFBundleDisplayName: Scorebug
        WKApplication: true
        WKCompanionAppBundleIdentifier: live.scorebug.app
        WKRunsIndependentlyOfCompanionApp: false
        UIAppFonts:
          - BarlowCondensed-Bold.ttf
          - BarlowCondensed-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.app.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ScorebugCore
  ScorebugAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
      - path: Sources/Scorebug/Debug/RecoveryLoopbackConfiguration.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.app.uitests
    dependencies:
      - target: Scorebug
  # View models, capture, streaming and recording on macOS: no simulator needed.
  ScorebugModelTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: Sources/Scorebug/Capture
      - path: Sources/Scorebug/Models
      - path: AppUITests/RecoveryControlConfiguration.swift
      - path: Sources/Scorebug/Debug/RecoveryLoopbackConfiguration.swift
      - path: FilmModelTests
      - path: AppModelTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.modeltests
    dependencies:
      - package: ScorebugMedia
      - package: ScorebugStreaming
      - package: ScorebugCore
schemes:
  ScorebugModelTests:
    build:
      targets:
        ScorebugModelTests: all
    test:
      targets:
        - ScorebugModelTests
  ScorebugWatch:
    build:
      targets:
        ScorebugWatch: all
  Scorebug:
    build:
      targets:
        Scorebug: all
    run:
      environmentVariables:
        SCOREBUG_TEST_API_URL: $(SCOREBUG_TEST_API_URL)
    test:
      targets:
        - ScorebugAppUITests
      environmentVariables:
        SCOREBUG_TEST_API_URL: $(SCOREBUG_TEST_API_URL)
        SCOREBUG_TEST_LINK: $(SCOREBUG_TEST_LINK)
        SCOREBUG_TEST_TOUR: $(SCOREBUG_TEST_TOUR)
