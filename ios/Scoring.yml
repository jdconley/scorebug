# Native scoring harness: deliberately independent of Project.yml and its media packages.
# Generate: xcodegen generate --spec ios/Scoring.yml
name: ScorebugScoring
options:
  bundleIdPrefix: live.scorebug
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '5.10'
    MARKETING_VERSION: '0.0.1'
    CURRENT_PROJECT_VERSION: '1'
packages:
  ScorebugCore:
    path: Packages/ScorebugCore
targets:
  ScorebugScoring:
    type: application
    platform: iOS
    sources:
      - path: Sources/ScorebugScoring
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.scoring
        PRODUCT_NAME: ScorebugScoring
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scorebug Scorer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      configs:
        Debug:
          INFOPLIST_FILE: Resources/Scoring-Debug.plist
    dependencies:
      - package: ScorebugCore
  ScorebugScoringUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.scoring.uitests
        TARGETED_DEVICE_FAMILY: '1'
    dependencies:
      - target: ScorebugScoring
  ScorebugScoringModelTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: Sources/ScorebugScoring/ScoringModel.swift
      - path: ModelTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.scorebug.scoring.modeltests
    dependencies:
      - package: ScorebugCore
schemes:
  ScorebugScoringModelTests:
    build:
      targets:
        ScorebugScoringModelTests: all
    test:
      targets:
        - ScorebugScoringModelTests
  ScorebugScoring:
    build:
      targets:
        ScorebugScoring: all
    test:
      targets:
        - ScorebugScoringUITests
      gatherCoverageData: true
      environmentVariables:
        SCOREBUG_TEST_API_URL: $(SCOREBUG_TEST_API_URL)
        SCOREBUG_TEST_SCENARIO: $(SCOREBUG_TEST_SCENARIO)
        SCOREBUG_TEST_TOKEN: qa-phone-token-not-production
