name: scorebug-qa

# Local fixtures only. These credentials are public test values.
services:
  ingest:
    image: scorebug/ingest:drain-v1
    build:
      context: ./vendor/MediaMTX
    ports:
      - '127.0.0.1:18890:8890/udp'
      - '127.0.0.1:19997:9997'
    volumes:
      - ./infra/local/ingest.yml:/mediamtx.yml:ro
      - ingest-recordings:/recordings
    stop_grace_period: 10s
  sink:
    image: bluenviron/mediamtx:1.21.0
    ports:
      - '127.0.0.1:11935:1935'
      - '127.0.0.1:19998:9997'
    volumes:
      - ./infra/local/sink.yml:/mediamtx.yml:ro
      - sink-recordings:/recordings
    stop_grace_period: 10s

volumes:
  ingest-recordings:
  sink-recordings:
