# Local-dev stack. Boots just the things that are awkward to run on the host:
# MediaMTX (SRT relay) so an iPhone can publish to your laptop for testing.
#
# Run control-plane, home-daemon, and scoring via `pnpm <app> dev` directly.
#
#   docker compose -f docker-compose.dev.yml up
#
# Then start the control plane with `INTERNAL_TOKEN` matching the value below.

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    network_mode: host
    environment:
      MTX_INTERNAL_TOKEN: dev-internal-token-1234567890abcdef
    volumes:
      - ./infra/vps/mediamtx.yml:/mediamtx.yml:ro
