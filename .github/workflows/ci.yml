name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm -r typecheck

      - name: test
        run: pnpm -r test

      - name: build
        run: pnpm -r build

      - name: prettier check
        run: pnpm format:check

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: ts
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/control-plane/Dockerfile
          push: false
          load: true
          tags: scorebug/control-plane:ci

      - name: build home-daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/home-daemon/Dockerfile
          push: false
          load: true
          tags: scorebug/home-daemon:ci
