name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (typecheck + test + build)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: set up ffmpeg (cached)
        uses: ./.github/actions/setup-ffmpeg

      - name: typecheck
        run: pnpm -r typecheck

      - name: test
        run: pnpm test

      - name: Worker tests (workerd)
        run: pnpm --filter @scorebug/control-plane test:worker

      - name: build
        run: pnpm -r build

      - name: prettier check
        run: pnpm format:check

  docker:
    name: Match container image
    runs-on: ubuntu-latest
    needs: ts
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: build home-daemon image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/home-daemon/Dockerfile
          push: false
          load: true
          tags: scorebug/home-daemon:ci
          cache-from: type=gha,scope=home-daemon
          cache-to: type=gha,scope=home-daemon,mode=max
      - name: run compiled worker and real software pipeline in final image
        run: node scripts/test-worker-container.mjs scorebug/home-daemon:ci
