name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: set up ffmpeg (cached)
        uses: ./.github/actions/setup-ffmpeg

      - name: typecheck
        run: pnpm -r typecheck

      - name: test
        run: pnpm test

      - name: real scoring API process recovery
        run: pnpm test:scoring

      - name: build
        run: pnpm -r build

      - name: prettier check
        run: pnpm format:check

  relay:
    name: Real SRT relay access and revocation
    runs-on: ubuntu-latest
    needs: ts
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: set up ffmpeg (cached)
        uses: ./.github/actions/setup-ffmpeg
      - name: build maintained relay with bounded drain
        run: docker build -t scorebug/ingest:drain-v1 vendor/MediaMTX
      - name: exercise real relay media and credentials
        run: pnpm test:relay
      - name: exercise native worker with software encoding
        run: pnpm test:worker software --soak-seconds=12

  docker:
    name: Docker images and server startup
    runs-on: ubuntu-latest
    needs: ts
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: build control-plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/control-plane/Dockerfile
          push: false
          load: true
          tags: scorebug/control-plane:ci

      - name: start final control-plane image and verify HTTP
        run: node scripts/test-container.mjs --image scorebug/control-plane:ci

      - name: verify isolated local relay configuration
        run: node scripts/test-local.mjs

      - name: verify deployment persistence and native relay provisioning
        run: node scripts/test-vps-stack.mjs --image scorebug/control-plane:ci

      - name: build home-daemon image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/home-daemon/Dockerfile
          push: false
          load: true
          tags: scorebug/home-daemon:ci
      - name: run compiled worker and real software pipeline in final image
        run: node scripts/test-worker-container.mjs scorebug/home-daemon:ci
