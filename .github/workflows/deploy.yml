name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/control-plane/**'
      # The match container image (built by wrangler deploy from its Dockerfile).
      - 'apps/home-daemon/**'
      - 'packages/protocol/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Deploys queue: cancelling one between the migration and the deploy would leave the schema
# ahead of the code.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  worker:
    name: Worker to scorebug.live
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: build protocol
        run: pnpm --filter @scorebug/protocol build
        working-directory: .

      - name: apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply scorebug --remote

      # Builds and pushes the match container image (Docker on the runner), then deploys.
      # The first deploy with container settings can 404 while applying them; once more
      # succeeds (seen in the Stream + Container spike).
      - name: deploy
        run: pnpm exec wrangler deploy || (sleep 15 && pnpm exec wrangler deploy)
