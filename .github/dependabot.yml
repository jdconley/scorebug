version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    ignore:
      # Node types follow the runtime (Node 22 in CI and the match container), not the latest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        patterns:
          - 'typescript'
          - 'tsx'
          - 'vitest'
          - 'prettier'
          - '@types/*'
      cloudflare:
        patterns:
          - 'wrangler'
          - '@cloudflare/*'
      runtime:
        patterns:
          - 'hono'
          - '@hono/*'
          - 'zod'
          - '@resvg/*'
