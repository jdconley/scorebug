version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns:
          - 'typescript'
          - 'tsx'
          - 'vite'
          - 'vitest'
          - '@vitejs/*'
          - 'prettier'
          - '@types/*'
      runtime:
        patterns:
          - 'hono'
          - '@hono/*'
          - 'ws'
          - '@types/ws'
          - 'react'
          - 'react-dom'
          - 'zod'
