logLevel: info
api: true
apiAddress: :9997
rtsp: false
rtmp: true
rtmpAddress: :1935
hls: false
webrtc: false
moq: false
srt: false
authInternalUsers:
  - user: qa-worker
    pass: qa-output-not-production
    permissions:
      - action: publish
        path: live/fixture
      - action: read
        path: live/fixture
  - user: qa-admin
    pass: qa-admin-not-production
    permissions:
      - action: api
paths:
  live/fixture:
    record: true
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordSegmentDuration: 1m
    recordDeleteAfter: 24h
