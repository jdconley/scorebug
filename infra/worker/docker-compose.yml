# Scorebug worker for the split topology: run this on the home machine.
# It connects outbound only (HTTPS to the API, SRT to the relay, RTMPS to
# YouTube); nothing here listens on the network.
#
# Normally started by `infra/install.sh worker --env-file worker.env`, which
# copies the server-generated worker.env next to this file. See
# docs/self-hosting.md.
name: scorebug-worker

services:
  worker:
    build:
      context: ../..
      dockerfile: apps/home-daemon/Dockerfile
    image: scorebug/home-daemon:${SCOREBUG_RELEASE:-local}
    restart: unless-stopped
    # The image's built-in `node` user; the worker needs no root privileges.
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    env_file: ./worker.env
    environment:
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      SCORE_DIR: /tmp/scorebug-worker
    healthcheck:
      # Healthy = the worker process is up and the control plane accepts its URL,
      # token and worker ID. It does not prove a broadcast is flowing.
      test: ['CMD', 'node', '/app/infra/worker-health.mjs']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - ../worker-health.mjs:/app/infra/worker-health.mjs:ro
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
