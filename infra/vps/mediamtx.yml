# The native API creates generation-scoped paths with distinct publish/read SRT
# encryption passphrases. No wildcard path or legacy shell hook is required.
logLevel: info
api: true
apiAddress: :9997
rtsp: false
rtmp: false
hls: false
webrtc: false
moq: false
srt: true
srtAddress: :8890
authInternalUsers:
  - user: any
    permissions:
      - action: publish
        path: '~^scorebug-[a-f0-9]{16}-[a-f0-9]{32}$'
      - action: read
        path: '~^scorebug-[a-f0-9]{16}-[a-f0-9]{32}$'
  - user: scorebug-admin
    # Compose requires and overrides this field. Do not launch this file alone.
    pass: overridden-by-required-compose-environment
    permissions:
      - action: api
paths: {}
