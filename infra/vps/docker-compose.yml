# Run from this directory after preparing the private .env file.
services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set the public API domain}
    depends_on:
      - control-plane

  control-plane:
    build:
      context: ../..
      dockerfile: apps/control-plane/Dockerfile
    image: scorebug/control-plane:${SCOREBUG_RELEASE:-local}
    restart: unless-stopped
    environment:
      PHONE_TOKEN: ${PHONE_TOKEN:?Set a private phone token}
      HOME_TOKEN: ${HOME_TOKEN:?Set a private worker token}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set a private installation secret}
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_PATH: /data/scorebug.sqlite
      INGEST_HOST: ${INGEST_HOST:?Set the externally reachable SRT hostname}
      INGEST_PORT: ${INGEST_PORT:-8890}
      RELAY_API_URL: http://mediamtx:9997
      RELAY_API_USERNAME: scorebug-admin
      RELAY_API_PASSWORD: ${RELAY_API_PASSWORD:?Set a private relay management password}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost.invalid}
      LOG_LEVEL: info
    volumes:
      - control_data:/data
    expose:
      - '8787'
    depends_on:
      - mediamtx
    stop_grace_period: 30s

  mediamtx:
    image: scorebug/ingest:campaign-probe-v3
    build:
      context: ../../vendor/MediaMTX
    restart: unless-stopped
    ports:
      - '${INGEST_PORT:-8890}:8890/udp'
    environment:
      MTX_AUTHINTERNALUSERS_1_PASS: ${RELAY_API_PASSWORD:?Set a private relay management password}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    stop_grace_period: 10s

volumes:
  control_data:
  caddy_data:
  caddy_config:
